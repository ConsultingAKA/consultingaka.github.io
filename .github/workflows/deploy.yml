name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Upload artifact
        run: |
          # Create artifact directory
          mkdir -p /tmp/artifact
          # Copy built files to artifact directory
          cp -r ./out/* /tmp/artifact/
          # Upload artifact
          echo "::group::Upload artifact"
          cd /tmp/artifact
          find . -type f -exec sha256sum {} \; > ../sha256sums.txt
          cd ..
          tar -czf artifact.tar.gz -C artifact .
          echo "GITHUB_PAGES_ARTIFACT=artifact.tar.gz" >> $GITHUB_ENV
          echo "::endgroup::"
      - name: Deploy to GitHub Pages
        id: deployment
        run: |
          echo "Deploying to GitHub Pages..."
          # Deploy using gh pages API
          echo "::group::Deploy Pages"
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -F "artifact=${{ env.GITHUB_PAGES_ARTIFACT }}" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments"
          echo "::endgroup::"